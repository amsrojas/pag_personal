<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tabla nutricional</title>
<style>
  :root {
    --ink: #141414;
    --muted: #6b6b6b;
    --line: #dedede;
    --bg: #ffffff;
    --error: #a12a2a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 440px; margin: 0 auto; padding: 48px 16px 64px; }
  h1 { font-size: 1.3rem; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: .95rem; }

  form { display: flex; gap: 8px; }
  input {
    flex: 1; min-width: 0;
    font: inherit; font-size: 1.05rem; letter-spacing: .06em;
    font-variant-numeric: tabular-nums;
    padding: 10px 12px; border: 1px solid #bdbdbd; border-radius: 8px;
    background: #fff; color: var(--ink);
  }
  input:focus { outline: 2px solid var(--ink); outline-offset: 1px; border-color: var(--ink); }
  button {
    font: inherit; padding: 10px 16px; border: 0; border-radius: 8px;
    background: var(--ink); color: #fff; cursor: pointer;
  }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .error { color: var(--error); font-size: .92rem; min-height: 1.4em; margin: 10px 0 0; }

  #resultado { animation: aparecer .25s ease-out; }
  @keyframes aparecer { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .nombre { margin: 28px 0 16px; font-size: 1.15rem; font-weight: 600; }

  /* Etiqueta: Arial o Helvética, como exige el artículo 27 de la Res. 810 */
  .etiqueta {
    border: 2px solid #000; padding: 10px 12px 8px;
    font-family: Arial, Helvetica, sans-serif; background: #fff; color: #000;
  }
  .etiqueta h2 { font-size: 1.55rem; font-weight: 900; line-height: 1.1; margin: 0; }
  .porcion { font-size: .92rem; padding: 4px 0 6px; border-bottom: 8px solid #000; }
  table { width: 100%; border-collapse: collapse; font-size: .95rem; }
  th { text-align: left; font-size: .8rem; font-weight: 700; padding: 4px 0; border-bottom: 1px solid #000; }
  td { padding: 4px 0; border-bottom: 1px solid #000; }
  td.v { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; padding-left: 12px; }
  tr.b td { font-weight: 700; font-size: 1.08rem; }
  tr.i1 td:first-child { padding-left: 16px; }
  tr.i2 td:first-child { padding-left: 32px; }
  tr.fin td { border-bottom: 5px solid #000; }
  tr:last-child td { border-bottom: 0; }
  .nota { font-size: .74rem; padding-top: 6px; border-top: 1px solid #000; }

  .meta { margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--line); }
  .meta .lbl { color: var(--muted); font-size: .85rem; margin: 0; }
  .meta .d { font-size: 2.1rem; font-weight: 600; letter-spacing: -0.02em; margin: 0; font-variant-numeric: tabular-nums; }
  .meta .ayuda { color: var(--muted); font-size: .88rem; margin: 6px 0 0; }
</style>
</head>
<body>
<main>
  <h1>Lectura matemática de una tabla nutricional</h1>
  <p class="sub">Escribe tu código para ver tu tabla.</p>

  <form id="form" autocomplete="off">
    <input id="codigo" inputmode="numeric" placeholder="Código estudiantil" aria-label="Código estudiantil">
    <button type="submit">Ver mi tabla</button>
  </form>
  <p id="error" class="error" role="alert"></p>

  <section id="resultado" hidden aria-live="polite">
    <p class="nombre" id="nombre"></p>

    <div class="etiqueta">
      <h2>Información Nutricional</h2>
      <div class="porcion" id="porcion"></div>
      <table>
        <thead><tr><th colspan="2">Cantidad por porción</th></tr></thead>
        <tbody id="filas"></tbody>
      </table>
      <div class="nota">Alimento hipotético con fines pedagógicos.</div>
    </div>

    <div class="meta">
      <p class="lbl">Valor al que debes llegar</p>
      <p class="d" id="d"></p>
    </div>
  </section>
      <footer class="pie-sitio">
      <p>
        <a href="../matematicas-salud.html">← Regresar</a>
      </p>
    </footer>
</main>

const SANGRIA = { "Grasa saturada": 1, "Fibra dietaria": 1, "Azúcares totales": 1, "Azúcares añadidos": 2 };

function fnv1a(texto) {
  let h = 0x811c9dc5;
  for (const b of new TextEncoder().encode(texto)) {
    h ^= b;
    h = Math.imul(h, 0x01000193) >>> 0;
  }
  return h >>> 0;
}

function mulberry32(a) {
  return function () {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return (t ^ (t >>> 14)) >>> 0;
  };
}

function descifrar(b64, codigo) {
  const sig = mulberry32(fnv1a("nombre:" + codigo));
  const crudo = atob(b64);
  const bytes = new Uint8Array(crudo.length);
  for (let i = 0; i < crudo.length; i++) bytes[i] = crudo.charCodeAt(i) ^ (sig() & 0xff);
  return new TextDecoder("utf-8").decode(bytes);
}

function fila(nombre, valor, clases) {
  const tr = document.createElement("tr");
  if (clases) tr.className = clases;
  const a = document.createElement("td");
  const b = document.createElement("td");
  a.textContent = nombre;
  b.textContent = valor;
  b.className = "v";
  tr.append(a, b);
  return tr;
}

function mostrar(codigo) {
  const reg = DATOS[fnv1a("radix-tabla:" + codigo).toString(16).padStart(8, "0")];
  const error = document.getElementById("error");
  const resultado = document.getElementById("resultado");
  if (!reg) {
    resultado.hidden = true;
    error.textContent = codigo ? "No encontramos ese código. Revísalo e inténtalo de nuevo." : "Escribe tu código.";
    return;
  }
  error.textContent = "";
  document.getElementById("nombre").textContent = descifrar(reg.n, codigo);
  document.getElementById("porcion").textContent = "Tamaño de porción: 1 unidad (" + reg.p + " g)";
  const cuerpo = document.getElementById("filas");
  cuerpo.replaceChildren();
  reg.f.forEach(([nombre, valor, negrilla], i) => {
    const clases = [negrilla ? "b" : "", SANGRIA[nombre] ? "i" + SANGRIA[nombre] : "", i === reg.f.length - 1 ? "fin" : ""]
      .filter(Boolean).join(" ");
    cuerpo.append(fila(nombre, valor, clases));
  });
  reg.m.forEach(([nombre, valor]) => cuerpo.append(fila(nombre, valor, "")));
  document.getElementById("d").textContent = "d ≈ " + reg.d;
  resultado.hidden = false;
  resultado.style.animation = "none";
  void resultado.offsetWidth;
  resultado.style.animation = "";
}

document.getElementById("form").addEventListener("submit", (e) => {
  e.preventDefault();
  mostrar(document.getElementById("codigo").value.replace(/\D/g, ""));
});
</script>
